name: Recent 2-week test

on:
  workflow_dispatch:

jobs:
  recent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python backtest/run_recent.py
      - uses: actions/upload-artifact@v4
        with:
          name: recent-2w
          path: backtest/results/recent_2w.json
      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backtest/results/recent_2w.json || true
          if git diff --staged --quiet; then echo none; else
            git commit -m "Recent 2-week test results [skip ci]"
            git push
          fi
