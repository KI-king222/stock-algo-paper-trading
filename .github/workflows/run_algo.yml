name: Run Algo Daily

on:
  workflow_dispatch:
  schedule:
    # Mo–Fr 21:00 UTC = 23:00 CEST (Sommer) / 22:00 CET (Winter)
    - cron: "0 21 * * 1-5"

jobs:
  algo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run algorithm
        run: python -m algo.run_daily
      - name: Commit state
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add state/ || true
          if git diff --staged --quiet; then
            echo "Keine State-Änderung"
          else
            git commit -m "Algo daily state $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
