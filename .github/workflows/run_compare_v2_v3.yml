name: Compare v2 vs v3 (4 weeks ~1y ago)

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python backtest/run_v2_v3_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-v3-compare-4w
          path: |
            backtest/results/compare_v2_4w_2025-10.json
            backtest/results/compare_v3_4w_2025-10.json
            backtest/results/compare_v2_v3_4w_summary.json
      - name: Commit results
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backtest/results/compare_v2_4w_2025-10.json \
                  backtest/results/compare_v3_4w_2025-10.json \
                  backtest/results/compare_v2_v3_4w_summary.json || true
          if git diff --staged --quiet; then echo none; else
            git commit -m "Save v2 vs v3 4-week compare ~2025-10 [skip ci]"
            git push
          fi
